/* ---------- Buyback amount count-up + confetti burst ---------- */

function injectBuybackAnimStyles(){
if(document.getElementById('ms-buyback-anim-style')) return;
var style = document.createElement('style');
style.id = 'ms-buyback-anim-style';
style.textContent =
'@keyframes msConfettiBurst{0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;}70%{opacity:1;}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.4);opacity:0;}}' +
'@keyframes msAmountFlash{0%{transform:scale(1);}35%{transform:scale(1.22);}65%{transform:scale(0.94);}100%{transform:scale(1);}}';
document.head.appendChild(style);
}

function burstConfetti(anchorEl){
injectBuybackAnimStyles();
var rect = anchorEl.getBoundingClientRect();
var cx = rect.left + rect.width / 2;
var cy = rect.top + rect.height / 2;
var colors = ['#2ee6ff', '#ff33e0', '#ffffff', '#7CE0FF', '#FF7EEA'];
var count = 34;
for(var i = 0; i < count; i++){
var el = document.createElement('div');
var angle = Math.random() * Math.PI * 2;
var dist = 70 + Math.random() * 110;
var dx = Math.cos(angle) * dist;
var dy = Math.sin(angle) * dist - 30;
var rot = (Math.random() * 720 - 360);
var w = 4 + Math.random() * 5;
var h = w * (1.4 + Math.random() * 0.8);
var color = colors[Math.floor(Math.random() * colors.length)];
var delay = Math.random() * 80;
el.style.cssText = 'position:fixed;left:' + cx + 'px;top:' + cy + 'px;width:' + w + 'px;height:' + h + 'px;margin:' + (-h/2) + 'px 0 0 ' + (-w/2) + 'px;background:' + color + ';border-radius:1px;pointer-events:none;z-index:1000001;--dx:' + dx + 'px;--dy:' + dy + 'px;--rot:' + rot + 'deg;animation:msConfettiBurst 950ms cubic-bezier(.2,.7,.3,1) ' + delay + 'ms forwards;';
document.body.appendChild(el);
(function(node){ setTimeout(function(){ node.remove(); }, 1100); })(el);
}
}

function animateBuybackCountUp(el, target){
injectBuybackAnimStyles();
var duration = 650; // "very quickly"
var start = null;
function frame(now){
if(start === null) start = now;
var t = Math.min(1, (now - start) / duration);
var eased = 1 - Math.pow(1 - t, 3);
el.textContent = '$' + (target * eased).toFixed(2);
if(t < 1){
requestAnimationFrame(frame);
}else{
el.textContent = '$' + target.toFixed(2);
el.style.animation = 'msAmountFlash 420ms ease-out';
burstConfetti(el);
}
}
requestAnimationFrame(frame);
}

function findLookupCode(container){
var scope = container ? container.ownerDocument : document;
var inputs = scope.querySelectorAll('input');
for(var i = 0; i < inputs.length; i++){
var v = (inputs[i].value || '').trim();
if(/^MS-[0-9A-F]+$/i.test(v)) return v.toUpperCase();
}
return null;
}

// On /sell-back, React swaps the code-lookup input out for a name/email/phone

// the DOM the code is already gone. This keeps a running record of the last

// still available afterward.
var lastLookupCode = null;
function trackLookupInputs(root){
(root || document).querySelectorAll('input').forEach(function(inp){
var v = (inp.value || '').trim();
if(/^MS-[0-9A-F]+$/i.test(v)) lastLookupCode = v.toUpperCase();
});
}

var codeLookupCache = {};
function fetchCoinByCode(code, context){
var cacheKey = code + '|' + (context || '');
if(codeLookupCache[cacheKey]) return codeLookupCache[cacheKey];
var p = fetch(SUPABASE_URL + '/functions/v1/validate-code', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
body: JSON.stringify({ code: code, context: context })
}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
codeLookupCache[cacheKey] = p;
return p;
}

var m = /SKU\s+(\S+)/.exec(text);
if(!m) return;
var sku = m[1];

var code = findLookupCode(card) || lastLookupCode;
if(!code) return;

card.dataset.msCoinCardDone = '1';

var context = isSellback ? 'sellback' : undefined;
fetchCoinByCode(code, context).then(function(data){
if(!data || !data.coin || data.sku !== sku) return;
var coin = data.coin;
if(!coin.image_url) return;

var summary = document.createElement('div');
summary.style.cssText = 'display:flex;align-items:center;gap:14px;cursor:pointer;';
var thumb = document.createElement('img');
thumb.src = coin.image_url;
thumb.alt = coin.name || sku;
thumb.style.cssText = 'width:64px;height:64px;object-fit:contain;background:#1b1c26;border-radius:8px;border:1px solid rgba(255,255,255,0.15);flex:0 0 auto;';
summary.appendChild(thumb);
var hint = document.createElement('div');
hint.textContent = 'Tap to view coin details';
hint.style.cssText = 'font-size:12px;color:rgba(255,255,255,0.5);';
summary.appendChild(hint);
summary.addEventListener('click', function(){
buildCoinModal().open(coinModalHtml(coin, sku, null));
});

var bbNum = (isSellback && data.buyback_price !== null && data.buyback_price !== undefined && data.buyback_price !== '') ? Number(data.buyback_price) : null;
var hasBuyback = bbNum !== null && isFinite(bbNum);

if(!hasBuyback){
card.insertBefore(summary, nameP);
return;
}

var topRow = document.createElement('div');
topRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:2px;';
topRow.appendChild(summary);

var revealBtn = document.createElement('button');
revealBtn.type = 'button';
revealBtn.textContent = 'Reveal Your Offer';
revealBtn.style.cssText = 'flex:0 0 auto;padding:12px 20px;border-radius:10px;border:none;font-weight:800;font-size:14px;letter-spacing:.02em;cursor:pointer;background:linear-gradient(90deg,#2ee6ff,#ff33e0);color:#05070d;box-shadow:0 0 0 rgba(46,230,255,0);transition:transform .15s,box-shadow .15s;';
revealBtn.addEventListener('mouseenter', function(){ revealBtn.style.transform = 'translateY(-1px)'; revealBtn.style.boxShadow = '0 6px 24px -6px #2ee6ff66'; });
revealBtn.addEventListener('mouseleave', function(){ revealBtn.style.transform = ''; revealBtn.style.boxShadow = '0 0 0 rgba(46,230,255,0)'; });
revealBtn.addEventListener('click', function(){
var wrap = document.createElement('div');
wrap.style.cssText = 'text-align:right;';
var label = document.createElement('div');
label.textContent = 'Your Buyback Offer';
label.style.cssText = 'font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:2px;';
var amountEl = document.createElement('div');
amountEl.id = 'ms-buyback-amount-' + sku;
amountEl.style.cssText = 'font-size:34px;font-weight:900;line-height:1;letter-spacing:-.02em;background:linear-gradient(90deg,#2ee6ff,#ff33e0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block;';
amountEl.textContent = '$0.00';
wrap.appendChild(label);
wrap.appendChild(amountEl);
revealBtn.replaceWith(wrap);
requestAnimationFrame(function(){ requestAnimationFrame(function(){ animateBuybackCountUp(amountEl, bbNum); }); });
});
topRow.appendChild(revealBtn);

card.insertBefore(topRow, nameP);
});
});
}

/* ---------- Resale marketplace: render live listings ---------- */

function patchResalePage(){
if(window.location.pathname !== '/resale') return;
if(document.getElementById('ms-resale-list')) return;

var paras = document.querySelectorAll('p');
var placeholder = null;
for(var i = 0; i < paras.length; i++){
if((paras[i].textContent || '').indexOf('No resale listings right now') !== -1){ placeholder = paras[i]; break; }
}
if(!placeholder || placeholder.dataset.msResaleDone) return;
placeholder.dataset.msResaleDone = '1';

var container = document.createElement('div');
container.id = 'ms-resale-list';
container.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px;color:rgba(255,255,255,0.5);font-size:13px;';
container.textContent = 'Loading listings…';
placeholder.parentNode.insertBefore(container, placeholder.nextSibling);

fetch(SUPABASE_URL + '/rest/v1/claims?select=id,sku,asking_price,coins(name,image_url)&offer_status=eq.available&order=claimed_at.desc', {
headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
}).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
container.textContent = '';
if(!rows || !rows.length){
placeholder.style.display = '';
return;
}
placeholder.style.display = 'none';
rows.forEach(function(row){
var coin = row.coins || {};
var card = document.createElement('div');
card.className = 'card';
card.style.cssText = 'padding:16px;';
var img = coin.image_url ? '<img src="' + escapeHtml(coin.image_url) + '" style="width:100%;aspect-ratio:1;object-fit:contain;background:#1b1c26;border-radius:8px;margin-bottom:10px;">' : '';
var price = fmtMoney(row.asking_price);
card.innerHTML = img +
'<div style="font-weight:700;margin-bottom:4px;">' + escapeHtml(coin.name || row.sku) + '</div>' +
(price ? '<div style="color:#2ee6ff;font-weight:800;margin-bottom:10px;">' + price + '</div>' : '') +
'<button type="button" class="btn-primary" style="width:100%;">Make an Offer</button>';
var btn = card.querySelector('button');
btn.addEventListener('click', function(){
var amount = window.prompt('Your offer amount ($):');
if(!amount || isNaN(Number(amount))) return;
var name = window.prompt('Your name:');
if(!name) return;
var email = window.prompt('Your email:');
if(!email) return;
btn.disabled = true;
btn.textContent = 'Submitting…';
fetch(SUPABASE_URL + '/functions/v1/resale-offer-submit', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
body: JSON.stringify({ claim_id: row.id, offer_amount: Number(amount), buyer_name: name, buyer_email: email })
}).then(function(r){ return r.json(); }).then(function(res){
btn.disabled = false;
if(res && res.ok){ btn.textContent = 'Offer sent!'; }
else { btn.textContent = 'Make an Offer'; window.alert((res && res.error) || 'Something went wrong.'); }
}).catch(function(){ btn.disabled = false; btn.textContent = 'Make an Offer'; window.alert('Something went wrong.'); });
});
container.appendChild(card);
});
}).catch(function(){
container.textContent = '';
placeholder.style.display = '';
});
}

/* ---------- Admin: session helpers for privileged REST calls ---------- */
  
  function getAdminAccessToken(){
    try{
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(!k || !/^sb-.*-auth-token$/.test(k)) continue;
        var raw = localStorage.getItem(k);
        if(!raw) continue;
        var parsed = JSON.parse(raw);
        var token = (parsed && parsed.access_token) || (parsed && parsed.currentSession && parsed.currentSession.access_token);
        if(token) return token;
      }
    }catch(e){}
    return null;
  }
  
  function adminHeaders(){
    return {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + (getAdminAccessToken() || SUPABASE_ANON_KEY),
      'Content-Type': 'application/json'
    };
  }
  
  function adminRest(path, opts){
    opts = opts || {};
    var fetchOpts = { method: opts.method || 'GET', headers: adminHeaders() };
    if(opts.body) fetchOpts.body = opts.body;
    return fetch(SUPABASE_URL + '/rest/v1/' + path, fetchOpts);
  }
  
  /* ---------- Admin: Payments panel (accepted-but-unpaid sell-backs + resale offers) ---------- */
  
  var paymentsPanelEl = null;
  
  function refreshPaymentsBadge(){
    if(!isAdminPage()) return;
    Promise.all([
      adminRest('sellback_submissions?select=id&status=eq.approved').then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
      adminRest('resale_offers?select=id&status=eq.accepted').then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
      ]).then(function(results){
      var count = (results[0] || []).length + (results[1] || []).length;
      var badge = document.getElementById('ms-payments-badge');
      if(!badge) return;
      if(count > 0){
        badge.textContent = String(count);
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
    });
  }
  
  function buildPaymentsPanel(){
    if(paymentsPanelEl) return paymentsPanelEl;
    var overlay = document.createElement('div');
    overlay.id = 'ms-payments-modal';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:999997;background:rgba(0,0,0,0.75);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;';
    var box = document.createElement('div');
    box.style.cssText = 'background:#12131c;color:#fff;max-width:720px;width:100%;border-radius:14px;padding:26px;position:relative;font-family:inherit;box-shadow:0 20px 60px rgba(0,0,0,0.5);';
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.textContent = '✕';
    closeBtn.title = 'Close';
    closeBtn.style.cssText = 'position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);color:#fff;font-size:16px;cursor:pointer;line-height:1;';
    closeBtn.addEventListener('click', function(){ close(); });
    var heading = document.createElement('h2');
    heading.textContent = 'Payments Due';
    heading.style.cssText = 'font-size:20px;font-weight:800;margin:0 0 16px;padding-right:40px;';
    var content = document.createElement('div');
    content.id = 'ms-payments-content';
    box.appendChild(closeBtn);
    box.appendChild(heading);
    box.appendChild(content);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if(e.target === overlay) close(); });
    document.addEventListener('keydown', function(e){ if(overlay.style.display !== 'none' && e.key === 'Escape') close(); });
    
    function renderRow(kind, item){
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.08);flex-wrap:wrap;';
      var left = document.createElement('div');
      if(kind === 'sellback'){
        left.innerHTML = '<div style="font-weight:700;">' + escapeHtml(item.name || item.email || 'Unknown') + '</div>' +
          '<div style="font-size:12px;color:rgba(255,255,255,0.5);">Sell-Back · SKU ' + escapeHtml(item.sku || '') + ' · ' + (fmtMoney(item.offered_price) || '—') + '</div>';
      } else {
        var coinName = (item.claims && item.claims.coins && item.claims.coins.name) || (item.claims && item.claims.sku) || '';
        left.innerHTML = '<div style="font-weight:700;">' + escapeHtml(item.buyer_name || item.buyer_email || 'Unknown') + '</div>' +
          '<div style="font-size:12px;color:rgba(255,255,255,0.5);">Resale · ' + escapeHtml(coinName) + ' · ' + (fmtMoney(item.offer_amount) || '—') + '</div>';
      }
      var right = document.createElement('div');
      right.style.cssText = 'display:flex;gap:8px;flex:0 0 auto;';
      var paidBtn = document.createElement('button');
      paidBtn.type = 'button';
      paidBtn.textContent = 'Mark Paid';
      paidBtn.style.cssText = 'padding:8px 14px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;background:linear-gradient(90deg,#2ee6ff,#ff33e0);color:#05070d;';
      paidBtn.addEventListener('click', function(){
        paidBtn.disabled = true;
        var table = kind === 'sellback' ? 'sellback_submissions' : 'resale_offers';
        adminRest(table + '?id=eq.' + item.id, { method: 'PATCH', body: JSON.stringify({ status: 'paid' }) }).then(function(r){
          if(r.ok){ loadPayments(); refreshPaymentsBadge(); }
          else { paidBtn.disabled = false; window.alert('Could not mark as paid.'); }
        });
      });
      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.textContent = 'Delete';
      delBtn.style.cssText = 'padding:8px 14px;border-radius:8px;border:1px solid rgba(255,120,120,0.4);background:transparent;color:#ff9a9a;font-size:13px;cursor:pointer;';
      delBtn.addEventListener('click', function(){
        if(!window.confirm('Delete this record permanently?')) return;
        delBtn.disabled = true;
        var table = kind === 'sellback' ? 'sellback_submissions' : 'resale_offers';
        adminRest(table + '?id=eq.' + item.id, { method: 'DELETE' }).then(function(r){
          if(r.ok){ loadPayments(); refreshPaymentsBadge(); }
          else { delBtn.disabled = false; window.alert('Could not delete.'); }
        });
      });
      right.appendChild(paidBtn);
      right.appendChild(delBtn);
      row.appendChild(left);
      row.appendChild(right);
      return row;
    }
    
    function loadPayments(){
      content.textContent = 'Loading…';
      Promise.all([
        adminRest('sellback_submissions?select=id,name,email,sku,offered_price,status&status=eq.approved&order=updated_at.desc').then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
        adminRest('resale_offers?select=id,offer_amount,buyer_name,buyer_email,status,claims(sku,coins(name))&status=eq.accepted&order=updated_at.desc').then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
        ]).then(function(results){
        var sellbacks = results[0] || [];
        var resales = results[1] || [];
        content.innerHTML = '';
        if(!sellbacks.length && !resales.length){
          var empty = document.createElement('div');
          empty.textContent = 'No payments due right now.';
          empty.style.cssText = 'color:rgba(255,255,255,0.5);font-size:13px;padding:8px 0;';
          content.appendChild(empty);
          return;
        }
        sellbacks.forEach(function(item){ content.appendChild(renderRow('sellback', item)); });
        resales.forEach(function(item){ content.appendChild(renderRow('resale', item)); });
      });
    }
    
    function open(){
      overlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      loadPayments();
    }
    function close(){
      overlay.style.display = 'none';
      document.body.style.overflow = '';
    }
    paymentsPanelEl = { open: open, close: close };
    return paymentsPanelEl;
  }
  function openPaymentsPanel(){ buildPaymentsPanel().open(); }
  
function patchAdminSidebar(){
  if(!isAdminPage()) return;
  if(document.getElementById('ms-payments-navitem')){ refreshPaymentsBadge(); return; }
  var ordersLink = document.querySelector('a[href="/admin/orders"]');
  var sourceLink = document.querySelector('a[href="/admin/submissions"]') || ordersLink;
  if(!ordersLink || !sourceLink) return;
  var nav = ordersLink.parentElement;
  if(!nav) return;
  
  var item = sourceLink.cloneNode(true);
  item.removeAttribute('href');
  item.id = 'ms-payments-navitem';
  item.style.cursor = 'pointer';
  item.innerHTML = '';
  item.style.display = 'flex';
  item.style.alignItems = 'center';
  item.style.justifyContent = 'space-between';
  item.style.gap = '8px';
  
  var labelSpan = document.createElement('span');
  labelSpan.textContent = 'Payments';
  item.appendChild(labelSpan);
  
  var badge = document.createElement('span');
  badge.id = 'ms-payments-badge';
  badge.style.cssText = 'display:none;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:linear-gradient(90deg,#2ee6ff,#ff33e0);color:#05070d;font-size:11px;font-weight:800;line-height:1;';
  item.appendChild(badge);
  
  item.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    openPaymentsPanel();
  });
  
  nav.insertBefore(item, ordersLink);
  refreshPaymentsBadge();
}
  
  /* ---------- Admin: Delete buttons on Sell-Back Requests / Resale Offers lists ---------- */
  
  function patchDeleteForList(anchorBtnText, table, buildQuery){
    var cards = [];
    document.querySelectorAll('.card').forEach(function(card){
      var hasAnchor = Array.prototype.some.call(card.querySelectorAll('button'), function(b){ return (b.textContent || '').trim() === anchorBtnText; });
      if(hasAnchor) cards.push(card);
    });
    if(!cards.length) return;
    var q = buildQuery();
    var allWired = cards.every(function(c){ return c.dataset.msDelWired === q; });
    if(allWired) return;
    
    fetch(SUPABASE_URL + '/rest/v1/' + q, { headers: adminHeaders() }).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
      cards.forEach(function(card, idx){
        card.dataset.msDelWired = q;
        var existing = card.querySelector('.ms-del-btn');
        if(existing) existing.remove();
        var row = rows[idx];
        if(!row || row.status === 'pending') return;
        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'ms-del-btn';
        delBtn.textContent = 'Delete';
        delBtn.style.cssText = 'padding:8px 14px;border-radius:8px;border:1px solid rgba(255,120,120,0.4);background:transparent;color:#ff9a9a;font-size:13px;cursor:pointer;margin-left:8px;';
        delBtn.addEventListener('click', function(e){
          e.preventDefault();
          if(!window.confirm('Delete this record permanently?')) return;
          delBtn.disabled = true;
          adminRest(table + '?id=eq.' + row.id, { method: 'DELETE' }).then(function(resp){
            if(resp.ok){ card.remove(); refreshPaymentsBadge(); }
            else { delBtn.disabled = false; window.alert('Could not delete.'); }
          });
        });
        var anchorBtn = Array.prototype.find.call(card.querySelectorAll('button'), function(b){ return (b.textContent || '').trim() === anchorBtnText; });
        var btnRow = anchorBtn ? anchorBtn.parentElement : card;
        btnRow.appendChild(delBtn);
      });
    });
  }
  
  function patchAdminListDeletes(){
    if(window.location.pathname === '/admin/submissions'){
      patchDeleteForList('Approve', 'sellback_submissions', function(){
        var sel = document.querySelector('select');
        var v = sel ? sel.value : 'all';
        return 'sellback_submissions?select=id,status&order=created_at.desc' + (v && v !== 'all' ? '&status=eq.' + encodeURIComponent(v) : '');
      });
    } else if(window.location.pathname === '/admin/resale-offers'){
      patchDeleteForList('Accept', 'resale_offers', function(){
        return 'resale_offers?select=id,status&order=created_at.desc';
      });
    }
  }
  
  /* ---------- Admin: fix stale "synced from Google Sheet" label on Overview ---------- */
  
  function patchAdminSyncLabel(){
    if(window.location.pathname !== '/admin') return;
    document.querySelectorAll('*').forEach(function(el){
      if(el.children.length) return;
      var t = el.textContent || '';
      if(t.indexOf('synced from Google Sheet') !== -1 && !el.dataset.msSyncLabelFixed){
        el.dataset.msSyncLabelFixed = '1';
        el.textContent = t.replace('synced from Google Sheet', 'synced from the coin input database');
      }
    });
  }
  
  function runAll(root){
patchCoinDbLight();
scanFlips(root);
patchBadges(root);
patchLogoVisibility(root);
patchDetailZoom(root);
trackLookupInputs(root);
patchClaimSellback();
patchResalePage();
if(isCoinInputTool()){
patchToolHeader();
patchToolLightboxBadges(root);
patchToolOpenLightbox();
}
}

onReady(function(){
runAll(document);
document.addEventListener('input', function(e){
var v = (e.target && e.target.value || '').trim();
if(/^MS-[0-9A-F]+$/i.test(v)) lastLookupCode = v.toUpperCase();
}, true);
var mo = new MutationObserver(function(muts){
var needsFullScan = false;
for(var i = 0; i < muts.length; i++){
var m = muts[i];
if(m.type === 'attributes' && m.attributeName === 'style'){
fixTransform(m.target);
}
if(m.addedNodes && m.addedNodes.length) needsFullScan = true;
}
if(needsFullScan) runAll(document);
});
mo.observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['style'] });

var tries = 0;
var iv = setInterval(function(){
tries++;
patchToolHeader();
patchToolOpenLightbox();
runAll(document);
if(tries > 20) clearInterval(iv);
}, 500);

  setInterval(function(){ refreshPaymentsBadge(); }, 20000);
});
})();
