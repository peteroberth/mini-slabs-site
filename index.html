var btnIn = mkBtn('+', 'Zoom in');
var btnOut = mkBtn('−', 'Zoom out');
var btnReset = mkBtn('↺', 'Reset');
var btnClose = mkBtn('✕', 'Close');
[btnIn, btnOut, btnReset, btnClose].forEach(function(b){ bar.appendChild(b); });
wrap.appendChild(bar);
document.body.appendChild(wrap);

var state = { scale: 1, x: 0, y: 0, panning: false, lastX: 0, lastY: 0 };
function apply(){
img.style.transform = 'translate(' + state.x + 'px,' + state.y + 'px) scale(' + state.scale + ')';
wrap.style.cursor = state.scale > 1 ? 'grab' : 'zoom-in';
}
function clamp(){
if(state.scale < 1) state.scale = 1;
if(state.scale > 8) state.scale = 8;
if(state.scale === 1){ state.x = 0; state.y = 0; }
}
function zoomAt(clientX, clientY, factor){
var rect = wrap.getBoundingClientRect();
var cx = clientX - rect.left - rect.width / 2;
var cy = clientY - rect.top - rect.height / 2;
var prevScale = state.scale;
state.scale = state.scale * factor;
clamp();
var ratio = state.scale / prevScale;
state.x = cx - (cx - state.x) * ratio;
state.y = cy - (cy - state.y) * ratio;
if(state.scale === 1){ state.x = 0; state.y = 0; }
apply();
}
function isBtn(t){ return t === btnIn || t === btnOut || t === btnReset || t === btnClose; }

wrap.addEventListener('wheel', function(e){
e.preventDefault();
var factor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

wrap.addEventListener('dblclick', function(e){
if(isBtn(e.target)) return;
zoomAt(e.clientX, e.clientY, state.scale > 1 ? (1 / state.scale) : 2.5);
});

wrap.addEventListener('mousedown', function(e){
if(isBtn(e.target)) return;

wrap.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', function(e){
if(!state.panning) return;
state.x += (e.clientX - state.lastX);
state.y += (e.clientY - state.lastY);
state.lastX = e.clientX; state.lastY = e.clientY;
apply();
});

if(e.touches.length === 2){
ts.startDist = dist(e.touches[0], e.touches[1]);

ts.panning = true;
ts.lastX = e.touches[0].clientX; ts.lastY = e.touches[0].clientY;

wrap.addEventListener('touchmove', function(e){
e.preventDefault();

function burstConfetti(anchorEl){
injectBuybackAnimStyles();
var rect = anchorEl.getBoundingClientRect();
var cx = rect.left + rect.width / 2;
var cy = rect.top + rect.height / 2;
var colors = ['#2ee6ff', '#ff33e0', '#ffffff', '#7CE0FF', '#FF7EEA'];
var count = 34;
for(var i = 0; i < count; i++){
var el = document.createElement('div');
var angle = Math.random() * Math.PI * 2;
var dist = 70 + Math.random() * 110;
var dx = Math.cos(angle) * dist;
var dy = Math.sin(angle) * dist - 30;
var rot = (Math.random() * 720 - 360);
var w = 4 + Math.random() * 5;
var h = w * (1.4 + Math.random() * 0.8);
var color = colors[Math.floor(Math.random() * colors.length)];
var delay = Math.random() * 80;
el.style.cssText = 'position:fixed;left:' + cx + 'px;top:' + cy + 'px;width:' + w + 'px;height:' + h + 'px;margin:' + (-h/2) + 'px 0 0 ' + (-w/2) + 'px;background:' + color + ';border-radius:1px;pointer-events:none;z-index:1000001;--dx:' + dx + 'px;--dy:' + dy + 'px;--rot:' + rot + 'deg;animation:msConfettiBurst 950ms cubic-bezier(.2,.7,.3,1) ' + delay + 'ms forwards;';
document.body.appendChild(el);
(function(node){ setTimeout(function(){ node.remove(); }, 1100); })(el);
}
}

function animateBuybackCountUp(el, target){
injectBuybackAnimStyles();
var duration = 650; // "very quickly"
var start = null;
function frame(now){
if(start === null) start = now;
var t = Math.min(1, (now - start) / duration);
var eased = 1 - Math.pow(1 - t, 3);
el.textContent = '$' + (target * eased).toFixed(2);
if(t < 1){
requestAnimationFrame(frame);
}else{
el.textContent = '$' + target.toFixed(2);
el.style.animation = 'msAmountFlash 420ms ease-out';
burstConfetti(el);
}
}
requestAnimationFrame(frame);
}

function findLookupCode(container){
var scope = container ? container.ownerDocument : document;
var inputs = scope.querySelectorAll('input');
for(var i = 0; i < inputs.length; i++){
var v = (inputs[i].value || '').trim();
if(/^MS-[0-9A-F]+$/i.test(v)) return v.toUpperCase();
}
return null;
}

// On /sell-back, React swaps the code-lookup input out for a name/email/phone
// form the moment a lookup succeeds, so by the time the result card exists in
// the DOM the code is already gone. This keeps a running record of the last
// value that looked like a code, captured live as the customer types, so it's
// still available afterward.
var lastLookupCode = null;
function trackLookupInputs(root){
(root || document).querySelectorAll('input').forEach(function(inp){
var v = (inp.value || '').trim();
if(/^MS-[0-9A-F]+$/i.test(v)) lastLookupCode = v.toUpperCase();
});
}

var codeLookupCache = {};
function fetchCoinByCode(code, context){
var cacheKey = code + '|' + (context || '');
if(codeLookupCache[cacheKey]) return codeLookupCache[cacheKey];
var p = fetch(SUPABASE_URL + '/functions/v1/validate-code', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
body: JSON.stringify({ code: code, context: context })
}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
codeLookupCache[cacheKey] = p;
return p;
}

/* ---------- My Collection: SELLING BACK badge while a sell-back is pending review ---------- */

function decodeJwtSub(token){
try{
var seg = token.split('.')[1];
seg = seg.replace(/-/g, '+').replace(/_/g, '/');
while(seg.length % 4) seg += '=';
var json = decodeURIComponent(Array.prototype.map.call(atob(seg), function(c){
return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
}).join(''));
var payload = JSON.parse(json);
return payload && payload.sub;
}catch(e){ return null; }
}

function patchMyCollection(){

var uid = decodeJwtSub(token);

]).then(function(results){

});

cards.forEach(function(card, idx){

function checkMutualFollow(myUid, otherUid, cb){
var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken() };
Promise.all([
fetch(SUPABASE_URL + '/rest/v1/follows?select=status&follower_id=eq.' + myUid + '&followee_id=eq.' + otherUid + '&status=eq.accepted', { headers: headers }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
fetch(SUPABASE_URL + '/rest/v1/follows?select=status&follower_id=eq.' + otherUid + '&followee_id=eq.' + myUid + '&status=eq.accepted', { headers: headers }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
]).then(function(results){
cb(results[0].length > 0 && results[1].length > 0);
}).catch(function(){ cb(false); });
}

function findOrCreateConversation(myUid, otherUid){
var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken(), 'Content-Type': 'application/json' };
return fetch(SUPABASE_URL + '/rest/v1/conversations?select=id&or=(and(user_a.eq.' + myUid + ',user_b.eq.' + otherUid + '),and(user_a.eq.' + otherUid + ',user_b.eq.' + myUid + '))', { headers: headers })
.then(function(r){ return r.ok ? r.json() : []; })
.then(function(rows){
if(rows[0]) return rows[0].id;
return fetch(SUPABASE_URL + '/rest/v1/conversations', {
method: 'POST',
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken(), 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
body: JSON.stringify({ user_a: myUid, user_b: otherUid })
}).then(function(r){ return r.ok ? r.json() : null; }).then(function(rowsRes){
return rowsRes && rowsRes[0] && rowsRes[0].id;
});
});
}

/* ---------- Admin: session helpers for privileged REST calls ---------- */

function getAdminAccessToken(){
try{
for(var i = 0; i < localStorage.length; i++){
var k = localStorage.key(i);
if(!k || !/^sb-.*-auth-token$/.test(k)) continue;
var raw = localStorage.getItem(k);
if(!raw) continue;
var parsed = JSON.parse(raw);
var token = (parsed && parsed.access_token) || (parsed && parsed.currentSession && parsed.currentSession.access_token);
if(token) return token;
}
}catch(e){}
return null;
}

function adminHeaders(){
return {
'apikey': SUPABASE_ANON_KEY,
'Authorization': 'Bearer ' + (getAdminAccessToken() || SUPABASE_ANON_KEY),
'Content-Type': 'application/json'
};
}

function adminRest(path, opts){
opts = opts || {};
var fetchOpts = { method: opts.method || 'GET', headers: adminHeaders() };
if(opts.body) fetchOpts.body = opts.body;
return fetch(SUPABASE_URL + '/rest/v1/' + path, fetchOpts);
}

/* ---------- Admin: Delete buttons on Sell-Back Requests / Resale Offers lists ---------- */

function patchDeleteForList(anchorBtnText, table, buildQuery){
var cards = [];
document.querySelectorAll('.card').forEach(function(card){
var hasAnchor = Array.prototype.some.call(card.querySelectorAll('button'), function(b){ return (b.textContent || '').trim() === anchorBtnText; });
if(hasAnchor) cards.push(card);
});
if(!cards.length) return;
var q = buildQuery();
var allWired = cards.every(function(c){ return c.dataset.msDelWired === q; });
if(allWired) return;

fetch(SUPABASE_URL + '/rest/v1/' + q, { headers: adminHeaders() }).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
cards.forEach(function(card, idx){
card.dataset.msDelWired = q;
var existing = card.querySelector('.ms-del-btn');
if(existing) existing.remove();
var row = rows[idx];
if(!row || row.status === 'pending') return;
var delBtn = document.createElement('button');
delBtn.type = 'button';
delBtn.className = 'ms-del-btn';
delBtn.textContent = 'Delete';
delBtn.style.cssText = 'padding:8px 14px;border-radius:8px;border:1px solid rgba(255,120,120,0.4);background:transparent;color:#ff9a9a;font-size:13px;cursor:pointer;margin-left:8px;';
delBtn.addEventListener('click', function(e){
e.preventDefault();
if(!window.confirm('Delete this record permanently?')) return;
delBtn.disabled = true;
adminRest(table + '?id=eq.' + row.id, { method: 'DELETE' }).then(function(resp){
if(resp.ok){ card.remove(); refreshPaymentsBadge(); }
else { delBtn.disabled = false; window.alert('Could not delete.'); }
});
});
var anchorBtn = Array.prototype.find.call(card.querySelectorAll('button'), function(b){ return (b.textContent || '').trim() === anchorBtnText; });
var btnRow = anchorBtn ? anchorBtn.parentElement : card;
btnRow.appendChild(delBtn);
});
});
}

item.style.cssText = 'display:block;padding:10px;border-bottom:1px solid rgba(255,255,255,0.08);text-decoration:none;color:inherit;' + (n.read_at ? 'opacity:0.55;' : '');

(n.body ? '<div style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:2px;">' + escapeHtml(n.body) + '</div>' : '');
panel.appendChild(item);
});
});
}

btn.addEventListener('click', function(e){
e.stopPropagation();
var isOpen = panel.style.display !== 'none';
panel.style.display = isOpen ? 'none' : 'block';
if(!isOpen){
loadNotifs();
var token = getAdminAccessToken();
var uid = token ? decodeJwtSub(token) : null;
if(uid){
fetch(SUPABASE_URL + '/rest/v1/notifications?user_id=eq.' + uid + '&read_at=is.null', {
method: 'PATCH',
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
body: JSON.stringify({ read_at: new Date().toISOString() })
}).then(function(){ setTimeout(function(){ badge.style.display = 'none'; }, 1200); });
}
}
});
document.addEventListener('click', function(e){
if(!wrap.contains(e.target)) panel.style.display = 'none';
});

notifBellEl = { refresh: loadNotifs };
return notifBellEl;
}

function patchNotifBell(){
var token = getAdminAccessToken();
if(!token) return;
var isNew = !notifBellEl;
buildNotifBell();
if(isNew) notifBellEl.refresh();
if(!window.__msNotifPollWired){
window.__msNotifPollWired = true;
setInterval(function(){ if(notifBellEl) notifBellEl.refresh(); }, 30000);
}
}

function runAll(root){
patchHomeHero();
patchCoinDbLight();
scanFlips(root);
patchBadges(root);
patchLogoVisibility(root);
patchDetailZoom(root);
patchCoinFlip(root);
patchCoinViewToggle();
trackLookupInputs(root);
patchLookupCardStyle();
patchClaimSellback();
patchResalePage();
patchPublicProfilePage();
patchMyCollection();
patchProfilePhotos();
patchCoinDetail();
refreshPaymentsBadge();
patchNotifBell();
if(isAdminPage()){
patchAdminSidebar();
patchAdminListDeletes();
patchAdminSyncLabel();
patchAdminToolLinks();
patchAdminPaymentsPage();
patchShopItemImageUpload();
}
if(isCoinInputTool()){
patchToolHeader();
patchToolLightboxBadges(root);
patchToolOpenLightbox();
}
}

onReady(function(){
runAll(document);
document.addEventListener('input', function(e){
var v = (e.target && e.target.value || '').trim();
if(/^MS-[0-9A-F]+$/i.test(v)) lastLookupCode = v.toUpperCase();
}, true);
var mo = new MutationObserver(function(muts){
var needsFullScan = false;
for(var i = 0; i < muts.length; i++){
var m = muts[i];
if(m.type === 'attributes' && m.attributeName === 'style'){
fixTransform(m.target);
}
if(m.addedNodes && m.addedNodes.length) needsFullScan = true;
}
if(needsFullScan) runAll(document);
});
mo.observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['style'] });

var tries = 0;
var iv = setInterval(function(){
tries++;
patchToolHeader();
patchToolOpenLightbox();
runAll(document);
if(tries > 20) clearInterval(iv);
}, 500);

setInterval(function(){ refreshPaymentsBadge(); }, 20000);
});
})();
