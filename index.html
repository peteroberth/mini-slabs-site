var pick, tries = 0;
do {

}, 220);

var stayDuration = 1000 + Math.random() * 1000;
setTimeout(function(){ renderSlot(slot, idx); }, stayDuration + 220);

if(coinFlipMapPromise) return coinFlipMapPromise;
coinFlipMapPromise = fetch(SUPABASE_URL + '/rest/v1/coins?select=sku,reverse_image_url&inventory=eq.true', {
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
}).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
var map = {};
(rows || []).forEach(function(row){ if(row.reverse_image_url) map[row.sku] = row.reverse_image_url; });

}).catch(function(){ return {}; });
return coinFlipMapPromise;
}

var vh = vw / opts.aspect;
var viewport = document.createElement('div');
viewport.style.cssText = 'position:relative;width:' + vw + 'px;height:' + vh + 'px;overflow:hidden;border-radius:' + (opts.round ? '50%' : '10px') + ';background:#000;margin:0 auto 14px;cursor:grab;user-select:none;border:1px solid rgba(255,255,255,0.15);';

var scale = minScale;
var offsetX = (vw - nw * scale) / 2;
var offsetY = (vh - nh * scale) / 2;

img.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;';
viewport.appendChild(img);

function render(){
img.style.width = (nw * scale) + 'px';
img.style.height = (nh * scale) + 'px';
img.style.left = offsetX + 'px';
img.style.top = offsetY + 'px';
}
function clamp(){
var minX = vw - nw * scale, minY = vh - nh * scale;
if(offsetX > 0) offsetX = 0;
if(offsetX < minX) offsetX = minX;
if(offsetY > 0) offsetY = 0;
if(offsetY < minY) offsetY = minY;
}
clamp(); render();

var dragging = false, lastX = 0, lastY = 0;
viewport.addEventListener('mousedown', function(e){ dragging = true; lastX = e.clientX; lastY = e.clientY; viewport.style.cursor = 'grabbing'; });
window.addEventListener('mousemove', function(e){
if(!dragging) return;
offsetX += e.clientX - lastX;
offsetY += e.clientY - lastY;
lastX = e.clientX; lastY = e.clientY;
clamp(); render();
});
window.addEventListener('mouseup', function(){ dragging = false; viewport.style.cursor = 'grab'; });
viewport.addEventListener('touchstart', function(e){
if(e.touches.length !== 1) return;
dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, { passive: true });
viewport.addEventListener('touchmove', function(e){
if(!dragging || e.touches.length !== 1) return;
offsetX += e.touches[0].clientX - lastX;
offsetY += e.touches[0].clientY - lastY;
lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;

}, { passive: true });

/* ---------- Buyback amount count-up + confetti burst ---------- */

function injectBuybackAnimStyles(){
if(document.getElementById('ms-buyback-anim-style')) return;
var style = document.createElement('style');
style.id = 'ms-buyback-anim-style';
style.textContent =
'@keyframes msConfettiBurst{0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;}70%{opacity:1;}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.4);opacity:0;}}' +
'@keyframes msAmountFlash{0%{transform:scale(1);}35%{transform:scale(1.22);}65%{transform:scale(0.94);}100%{transform:scale(1);}}';
document.head.appendChild(style);
}

function burstConfetti(anchorEl){
injectBuybackAnimStyles();
var rect = anchorEl.getBoundingClientRect();
var cx = rect.left + rect.width / 2;
var cy = rect.top + rect.height / 2;
var colors = ['#FFD639', '#FF8A3D', '#ffffff', '#FFE580', '#FFB366'];
var count = 34;
for(var i = 0; i < count; i++){
var el = document.createElement('div');
var angle = Math.random() * Math.PI * 2;
var dist = 70 + Math.random() * 110;
var dx = Math.cos(angle) * dist;
var dy = Math.sin(angle) * dist - 30;
var rot = (Math.random() * 720 - 360);
var w = 4 + Math.random() * 5;
var h = w * (1.4 + Math.random() * 0.8);
var color = colors[Math.floor(Math.random() * colors.length)];
var delay = Math.random() * 80;
el.style.cssText = 'position:fixed;left:' + cx + 'px;top:' + cy + 'px;width:' + w + 'px;height:' + h + 'px;margin:' + (-h/2) + 'px 0 0 ' + (-w/2) + 'px;background:' + color + ';border-radius:1px;pointer-events:none;z-index:1000001;--dx:' + dx + 'px;--dy:' + dy + 'px;--rot:' + rot + 'deg;animation:msConfettiBurst 950ms cubic-bezier(.2,.7,.3,1) ' + delay + 'ms forwards;';
document.body.appendChild(el);
(function(node){ setTimeout(function(){ node.remove(); }, 1100); })(el);
}
}

function animateBuybackCountUp(el, target){
injectBuybackAnimStyles();
var duration = 650; // "very quickly"
var start = null;
function frame(now){
if(start === null) start = now;
var t = Math.min(1, (now - start) / duration);
var eased = 1 - Math.pow(1 - t, 3);
el.textContent = '$' + (target * eased).toFixed(2);
if(t < 1){
requestAnimationFrame(frame);
}else{
el.textContent = '$' + target.toFixed(2);
el.style.animation = 'msAmountFlash 420ms ease-out';
burstConfetti(el);
}
}
requestAnimationFrame(frame);
}

function findLookupCode(container){
var scope = container ? container.ownerDocument : document;
var inputs = scope.querySelectorAll('input');
for(var i = 0; i < inputs.length; i++){

if(/^MS-[0-9A-F]+$/i.test(v)) return v.toUpperCase();
}
return null;
}

// On /sell-back, React swaps the code-lookup input out for a name/email/phone
// form the moment a lookup succeeds, so by the time the result card exists in
// the DOM the code is already gone. This keeps a running record of the last
// value that looked like a code, captured live as the customer types, so it's
// still available afterward.
var lastLookupCode = null;
function trackLookupInputs(root){
(root || document).querySelectorAll('input').forEach(function(inp){
var v = (inp.value || '').trim();
if(/^MS-[0-9A-F]+$/i.test(v)) lastLookupCode = v.toUpperCase();
});
}

function fetchCoinByCode(code, context){

body: JSON.stringify({ code: code, context: context })
}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
codeLookupCache[cacheKey] = p;
return p;
}

// lookup form: fills the native (React-controlled) input using the same
// property-descriptor-setter trick used for image-upload inputs elsewhere in this file
// (plain .value= doesn't notify React), then clicks "Look up" for the visitor.
function consumePendingSellbackCode(){
if(window.location.pathname !== '/sell-back') return;
var code;
try{ code = sessionStorage.getItem('ms-pending-sellback-code'); }catch(e){ code = null; }
if(!code) return;
var input = document.querySelector('input.input');
var form = input ? input.closest('form') : null;
var btn = form ? form.querySelector('button') : null;
if(!input || !btn) return;

/* ---------- My Collection: SELLING BACK badge while a sell-back is pending review ---------- */

function decodeJwtSub(token){
try{
var seg = token.split('.')[1];
seg = seg.replace(/-/g, '+').replace(/_/g, '/');
while(seg.length % 4) seg += '=';
var json = decodeURIComponent(Array.prototype.map.call(atob(seg), function(c){
return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
}).join(''));
var payload = JSON.parse(json);
return payload && payload.sub;
}catch(e){ return null; }
}

function patchMyCollection(){
if(window.location.pathname !== '/account') return;
var token = getAdminAccessToken();
if(!token) return;
var uid = decodeJwtSub(token);
if(!uid) return;

var cards = [];
document.querySelectorAll('.card').forEach(function(c){
if(c.dataset.msSellbackChecked) return;
var t = c.textContent || '';
if(t.indexOf('SKU') !== -1 && t.indexOf('Claimed') !== -1){
c.dataset.msSellbackChecked = '1';
cards.push(c);
}
});
if(!cards.length) return;

var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token };
Promise.all([
fetch(SUPABASE_URL + '/rest/v1/claims?select=id,code,sku,claimed_at&user_id=eq.' + uid + '&order=claimed_at.desc', { headers: headers })
.then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
fetch(SUPABASE_URL + '/rest/v1/sellback_submissions?select=code,status&user_id=eq.' + uid, { headers: headers })
.then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
]).then(function(results){
var claimsRows = results[0] || [];
var subs = results[1] || [];
var statusByCode = {};
subs.forEach(function(s){
if(s.status === 'pending' || s.status === 'approved') statusByCode[s.code] = s.status;
});

cards.forEach(function(card, idx){
var claimRow = claimsRows[idx];
if(claimRow && claimRow.sku){
var thumbEl = card.querySelector('img');
if(thumbEl) wireCoinInfoClick(thumbEl, claimRow.sku, 'zoom-in');
}
});

cards.forEach(function(card, idx){
card.dataset.msSellbackChecked = '1';
var row = claimsRows[idx];
if(!row) return;
var status = statusByCode[row.code];
if(!status) return;

var link = Array.prototype.filter.call(card.querySelectorAll('a'), function(a){
return /Sell this back/.test(a.textContent || '');
})[0];
if(link) link.style.display = 'none';
var resaleBox = card.querySelector('.border-t');
if(resaleBox) resaleBox.style.display = 'none';

var badge = document.createElement('div');
badge.textContent = status === 'approved' ? 'SELLING BACK · APPROVED' : 'SELLING BACK · PENDING REVIEW';
badge.style.cssText = 'display:inline-block;margin:0 0 12px;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),var(--magenta));color:#05070d;';
var anchor = link || resaleBox;
if(anchor) card.insertBefore(badge, anchor);
else card.appendChild(badge);
});
});
}

/* ---------- Site-wide: block suspended users ---------- */

var __msSuspensionLastFetch = 0;
var __msSuspensionInFlight = false;
function enforceOwnSuspension(){
var token = getAdminAccessToken();
if(!token) return;
if(document.getElementById('ms-suspended-overlay')) return;
var uid = decodeJwtSub(token);
if(!uid) return;
if(__msSuspensionInFlight) return;
var now = Date.now();
if((now - __msSuspensionLastFetch) < 4000) return;
__msSuspensionLastFetch = now;
__msSuspensionInFlight = true;
fetch(SUPABASE_URL + '/rest/v1/profiles?select=suspended_until,suspension_reason,is_permanently_suspended&id=eq.' + uid, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token } })
.then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
__msSuspensionInFlight = false;
var p = rows[0];
if(!p) return;
var isSuspended = p.is_permanently_suspended || (p.suspended_until && new Date(p.suspended_until) > new Date());
if(!isSuspended) return;
showSuspensionBlock(p, token);
}).catch(function(){ __msSuspensionInFlight = false; });
}

function showSuspensionBlock(p, token){
if(document.getElementById('ms-suspended-overlay')) return;
var overlay = document.createElement('div');
overlay.id = 'ms-suspended-overlay';
overlay.style.cssText = 'position:fixed;inset:0;background:#05070d;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;';
var card = document.createElement('div');
card.style.cssText = 'max-width:440px;width:100%;text-align:center;';
var title = document.createElement('div');
title.textContent = 'Account Suspended';
title.style.cssText = 'font-size:24px;font-weight:900;color:#fff;margin-bottom:12px;';
var msg = document.createElement('div');
var untilText = p.is_permanently_suspended ? 'permanently' : ('until ' + new Date(p.suspended_until).toLocaleDateString() + ' ' + new Date(p.suspended_until).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
msg.textContent = 'Your account has been suspended ' + untilText + '.' + (p.suspension_reason ? (' Reason: ' + p.suspension_reason) : '');
msg.style.cssText = 'font-size:14px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:24px;';
var btn = document.createElement('button');
btn.type = 'button'; btn.textContent = 'Sign Out';
btn.style.cssText = 'padding:10px 24px;border-radius:999px;border:none;background:linear-gradient(90deg,var(--cyan),var(--magenta));color:#05070d;font-weight:800;font-size:13px;cursor:pointer;';
function doSignOut(){
fetch(SUPABASE_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token } }).catch(function(){}).then(function(){
try{
for(var i = localStorage.length - 1; i >= 0; i--){
var k = localStorage.key(i);
if(k && /^sb-.*-auth-token$/.test(k)) localStorage.removeItem(k);
}
}catch(e){}
window.location.href = '/';
});
}
btn.addEventListener('click', doSignOut);
card.appendChild(title); card.appendChild(msg); card.appendChild(btn);
overlay.appendChild(card);
document.body.appendChild(overlay);
}

/* ---------- Messaging between mutual followers ---------- */

function checkMutualFollow(myUid, otherUid, cb){
var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken() };
Promise.all([
fetch(SUPABASE_URL + '/rest/v1/follows?select=status&follower_id=eq.' + myUid + '&followee_id=eq.' + otherUid + '&status=eq.accepted', { headers: headers }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
fetch(SUPABASE_URL + '/rest/v1/follows?select=status&follower_id=eq.' + otherUid + '&followee_id=eq.' + myUid + '&status=eq.accepted', { headers: headers }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
]).then(function(results){
cb(results[0].length > 0 && results[1].length > 0);
}).catch(function(){ cb(false); });
}

function findOrCreateConversation(myUid, otherUid){
var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken(), 'Content-Type': 'application/json' };
return fetch(SUPABASE_URL + '/rest/v1/conversations?select=id&or=(and(user_a.eq.' + myUid + ',user_b.eq.' + otherUid + '),and(user_a.eq.' + otherUid + ',user_b.eq.' + myUid + '))', { headers: headers })
.then(function(r){ return r.ok ? r.json() : []; })
.then(function(rows){
if(rows[0]) return rows[0].id;
// conversations has a CHECK(user_a < user_b) constraint to prevent duplicate rows
// for the same pair in either order — the two ids must be sorted before insert.
var ua = myUid < otherUid ? myUid : otherUid;
var ub = myUid < otherUid ? otherUid : myUid;
return fetch(SUPABASE_URL + '/rest/v1/conversations', {
method: 'POST',
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken(), 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
body: JSON.stringify({ user_a: ua, user_b: ub })
}).then(function(r){ return r.ok ? r.json() : null; }).then(function(rowsRes){
return rowsRes && rowsRes[0] && rowsRes[0].id;
});
});
}

}).catch(function(){ loadMessages(); });

function patchMessagesPage(){
var path = window.location.pathname;
var listMatch = path === '/messages';
var threadMatch = /^\/messages\/([0-9a-fA-F-]{36})$/.exec(path);
if(!threadMatch && window.__msThreadPollId){ clearInterval(window.__msThreadPollId); window.__msThreadPollId = null; }
if(!listMatch && !threadMatch) return;
var token = getAdminAccessToken();
if(!token) return;
var uid = decodeJwtSub(token);
if(!uid) return;

var key = listMatch ? 'list' : ('thread:' + threadMatch[1]);
var existing = document.getElementById('ms-messages-page');
if(existing && existing.dataset.key === key) return;

var main = document.querySelector('main');
if(!main) return;
var container = document.createElement('div');
container.id = 'ms-messages-page';
container.dataset.key = key;
container.style.cssText = 'max-width:640px;margin:0 auto;padding-top:20px;';
main.innerHTML = '';
main.appendChild(container);

if(listMatch){
renderConversationList(container, uid);
} else {
var conversationId = threadMatch[1];
var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token };
fetch(SUPABASE_URL + '/rest/v1/conversations?select=id,user_a,user_b,hidden_party_id&id=eq.' + conversationId, { headers: headers })
.then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
var convo = rows[0];
if(!convo){
container.innerHTML = '<p style="color:rgba(255,255,255,0.6);">Conversation not found.</p>';
return;
}
var otherId = convo.user_a === uid ? convo.user_b : convo.user_a;
var isHidden = !!(convo.hidden_party_id && convo.hidden_party_id === otherId);
if(isHidden){
renderConversationThread(container, conversationId, uid, null, otherId, true);
return;
}
fetch(SUPABASE_URL + '/rest/v1/profiles?select=display_name,avatar_url&id=eq.' + otherId, { headers: headers })
.then(function(r){ return r.ok ? r.json() : []; }).then(function(profRows){
renderConversationThread(container, conversationId, uid, profRows[0], otherId, false);
});
}).catch(function(){
container.textContent = 'Could not load this conversation.';
});
}
}

function submitReport(targetType, targetId, reason, cb){

if(!myToken){ window.location.href = '/login'; return; }

fetch(SUPABASE_URL + '/rest/v1/reports', {

body: JSON.stringify({ reporter_id: myUid, target_type: targetType, target_id: targetId, reason: reason })
}).then(function(r){ cb(r.ok); }).catch(function(){ cb(false); });
}

function promptAndReport(targetType, targetId, label){
var myToken = getAdminAccessToken();
if(!myToken){ window.location.href = '/login'; return; }
var reason = window.prompt('Report ' + (label || 'this') + ' — please describe the issue:');
if(!reason || !reason.trim()) return;
submitReport(targetType, targetId, reason.trim(), function(ok){
window.alert(ok ? "Thanks, your report has been sent to our admins." : 'Could not send report. Please try again.');
});
}

/* ---------- Block users (from profile, comments, followers/following list) ---------- */

function checkIsBlocked(myUid, otherUid, cb){
if(!myUid || !otherUid){ cb(false); return; }
var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken() };
fetch(SUPABASE_URL + '/rest/v1/blocks?select=id&blocker_id=eq.' + myUid + '&blocked_id=eq.' + otherUid, { headers: headers })
.then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){ cb(rows.length > 0); }).catch(function(){ cb(false); });
}

function setUserBlocked(myUid, otherUid, blocked){
var authHeaders = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken(), 'Content-Type': 'application/json' };
if(blocked){
return fetch(SUPABASE_URL + '/rest/v1/blocks', { method: 'POST', headers: authHeaders, body: JSON.stringify({ blocker_id: myUid, blocked_id: otherUid }) });
}
return fetch(SUPABASE_URL + '/rest/v1/blocks?blocker_id=eq.' + myUid + '&blocked_id=eq.' + otherUid, { method: 'DELETE', headers: authHeaders });
}

/* Returns a ready-to-append <button> that toggles between Block/Unblock for
otherUserId, as seen by myUid. Hidden entirely when logged out or viewing
yourself. onChanged(nowBlocked) fires after a successful toggle so callers
can refresh a list/hide content as needed. */
function buildBlockButton(otherUserId, myUid, onChanged){
var btn = document.createElement('button');
btn.type = 'button';
btn.style.cssText = 'flex:0 0 auto;background:none;border:1px solid rgba(255,255,255,0.15);border-radius:999px;padding:7px 14px;font-size:12px;color:rgba(255,255,255,0.55);cursor:pointer;display:none;';
if(!myUid || !otherUserId || myUid === otherUserId) return btn;
btn.style.display = '';
function paint(blocked){
btn.dataset.blocked = blocked ? '1' : '';
btn.textContent = blocked ? 'Unblock' : 'Block';
btn.style.color = blocked ? '#ff8a8a' : 'rgba(255,255,255,0.55)';
btn.style.borderColor = blocked ? 'rgba(229,72,77,0.4)' : 'rgba(255,255,255,0.15)';
}
btn.textContent = '…';
checkIsBlocked(myUid, otherUserId, paint);
btn.addEventListener('click', function(){
var goingTo = btn.dataset.blocked !== '1';
if(goingTo && !window.confirm('Block this user? They won\'t be able to follow, message, comment, or react to you, and any existing follow between you will be removed.')) return;
btn.disabled = true;
setUserBlocked(myUid, otherUserId, goingTo).then(function(r){
btn.disabled = false;
if(r.ok){ paint(goingTo); onChanged && onChanged(goingTo); }
});
});
return btn;
}

var __msMessagesBadgeInFlight = false;

var now = Date.now();

var token = getAdminAccessToken();
if(!token) return;
var uid = decodeJwtSub(token);
if(!uid) return;
__msMessagesBadgeLastFetch = now;
__msMessagesBadgeInFlight = true;
fetch(SUPABASE_URL + '/rest/v1/messages?select=id,sender_id&read_at=is.null', {
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token }
}).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
__msMessagesBadgeInFlight = false;
var count = rows.filter(function(m){ return m.sender_id !== uid; }).length;
setBadgeValue(badge, count);
}).catch(function(){ __msMessagesBadgeInFlight = false; });
}

/* ---------- Coin wishlist: like coins you don't own + owner reach-out ---------- */

function startAnonymousReachOut(myUid, otherUid){
var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken() };
return fetch(SUPABASE_URL + '/rest/v1/conversations?select=id&or=(and(user_a.eq.' + myUid + ',user_b.eq.' + otherUid + '),and(user_a.eq.' + otherUid + ',user_b.eq.' + myUid + '))', { headers: headers })
.then(function(r){ return r.ok ? r.json() : []; })
.then(function(rows){
if(rows[0]) return rows[0].id;
// conversations has a CHECK(user_a < user_b) constraint — sort ids before insert.
// hidden_party_id still refers to myUid regardless of which column it lands in.
var ua = myUid < otherUid ? myUid : otherUid;
var ub = myUid < otherUid ? otherUid : myUid;
return fetch(SUPABASE_URL + '/rest/v1/conversations', {
method: 'POST',
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken(), 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
body: JSON.stringify({ user_a: ua, user_b: ub, hidden_party_id: myUid })
}).then(function(r){ return r.ok ? r.json() : null; }).then(function(rowsRes){
return rowsRes && rowsRes[0] && rowsRes[0].id;
});
});
}

function fetchWishlistCount(sku){
var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + (getAdminAccessToken() || SUPABASE_ANON_KEY), 'Content-Type': 'application/json' };
return fetch(SUPABASE_URL + '/rest/v1/rpc/get_wishlist_count', { method: 'POST', headers: headers, body: JSON.stringify({ p_sku: sku }) })
.then(function(r){ return r.ok ? r.json() : 0; }).then(function(n){ return n || 0; }).catch(function(){ return 0; });
}

/* ---------- Private accounts: "interested" one-time ping on a public claim ---------- */

function submitClaimInterest(claim, ownerUid, btn){
var myToken = getAdminAccessToken();
if(!myToken){ window.location.href = '/login'; return; }
var myUid = decodeJwtSub(myToken);
if(myUid === ownerUid) return;
btn.disabled = true;
btn.textContent = 'Sending…';
fetch(SUPABASE_URL + '/rest/v1/profiles?select=display_name&id=eq.' + myUid, {
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + myToken }
}).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
var myName = (rows[0] && rows[0].display_name) || 'Someone';
var coinName = (claim.coins && claim.coins.name) || claim.sku || 'a coin';
return fetch(SUPABASE_URL + '/rest/v1/notifications', {
method: 'POST',
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + myToken, 'Content-Type': 'application/json' },
body: JSON.stringify({
user_id: ownerUid,
type: 'claim_interest',
title: myName + ' is interested in your ' + coinName,
body: 'They asked to be put in touch. Reply below to message them — this is a one-time notice.',
related_user_id: myUid,
claim_id: claim.id
})
});
}).then(function(r){
if(r.ok){
btn.textContent = 'Interest sent ✓';
} else {
btn.textContent = 'Could not send';
btn.disabled = false;
}
}).catch(function(){
btn.textContent = 'Could not send';
btn.disabled = false;
});
}

function loadPostReactions(bar, postId, myUid, canInteract){
var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + (getAdminAccessToken() || SUPABASE_ANON_KEY) };

.then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
bar.innerHTML = '';

var mine = null;
rows.forEach(function(row){
counts[row.reaction] = (counts[row.reaction] || 0) + 1;
if(row.user_id === myUid) mine = row.reaction;
});
POST_REACTIONS.forEach(function(def){
var key = def[0], emoji = def[1];

req = fetch(SUPABASE_URL + '/rest/v1/post_reactions?post_id=eq.' + postId + '&user_id=eq.' + myUid, { method: 'DELETE', headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken() } });

req = fetch(SUPABASE_URL + '/rest/v1/post_reactions', {
method: 'POST',
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + getAdminAccessToken(), 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
body: JSON.stringify({ post_id: postId, user_id: myUid, reaction: newReaction })
});
}
req.then(function(){ loadPostReactions(bar, postId, myUid, canInteract); }).catch(function(){ btn.disabled = false; });
});
} else {
btn.disabled = true;
btn.style.cursor = 'default';
}
bar.appendChild(btn);
});
});
}

/* ---------- Admin: session helpers for privileged REST calls ---------- */

function getAdminAccessToken(){
try{
for(var i = 0; i < localStorage.length; i++){
var k = localStorage.key(i);
if(!k || !/^sb-.*-auth-token$/.test(k)) continue;
var raw = localStorage.getItem(k);
if(!raw) continue;
var parsed = JSON.parse(raw);
var token = (parsed && parsed.access_token) || (parsed && parsed.currentSession && parsed.currentSession.access_token);
if(token) return token;
}
}catch(e){}
return null;
}

function adminHeaders(){
return {
'apikey': SUPABASE_ANON_KEY,
'Authorization': 'Bearer ' + (getAdminAccessToken() || SUPABASE_ANON_KEY),
'Content-Type': 'application/json'
};
}

function adminRest(path, opts){
opts = opts || {};
var fetchOpts = { method: opts.method || 'GET', headers: adminHeaders() };
if(opts.body) fetchOpts.body = opts.body;
return fetch(SUPABASE_URL + '/rest/v1/' + path, fetchOpts);
}

/* Single source of truth for the top Admin badge + the Payments/Reports sidebar
badges. Previously refreshPaymentsBadge() and refreshReportsBadge() each wrote
their own (different) total to the shared top badge independently, and both
were re-triggered on every DOM mutation via runAll() — the two competing async
writes landed in whatever order the network returned them, which is what made
the numbers appear to flash/flicker. Now there's one throttled fetch that
computes all three counts together and writes each badge at most once. */
var __msAdminBadgeLastFetch = 0;
var __msAdminBadgeInFlight = false;

function setBadgeValue(badge, count){
if(!badge) return;
if(count > 0){
var text = String(count);
if(badge.textContent !== text) badge.textContent = text;
if(badge.style.display !== 'inline-flex') badge.style.display = 'inline-flex';
} else {
if(badge.style.display !== 'none') badge.style.display = 'none';
}
}

function refreshAdminBadgeCounts(force){
var topBadge = ensureTopAdminBadge();
var paymentsBadge = document.getElementById('ms-payments-badge');
var reportsBadge = document.getElementById('ms-reports-badge');
if(!topBadge && !paymentsBadge && !reportsBadge) return;
if(__msAdminBadgeInFlight) return;
var now = Date.now();
if(!force && (now - __msAdminBadgeLastFetch) < 4000) return;
__msAdminBadgeLastFetch = now;
__msAdminBadgeInFlight = true;
Promise.all([
adminRest('reports?select=id&status=eq.open').then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
adminRest('sellback_submissions?select=id&status=eq.approved').then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
adminRest('resale_offers?select=id&status=eq.accepted').then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
]).then(function(results){
__msAdminBadgeInFlight = false;
var reportsCount = (results[0] || []).length;
var paymentsCount = (results[1] || []).length + (results[2] || []).length;
setBadgeValue(reportsBadge, reportsCount);
setBadgeValue(paymentsBadge, paymentsCount);
setBadgeValue(topBadge, reportsCount + paymentsCount);
}).catch(function(){ __msAdminBadgeInFlight = false; });
}

function refreshPaymentsBadge(force){ refreshAdminBadgeCounts(force); }

// "/admin/reports" isn't a real React Router route — it only works when reached via
// client-side navigation from inside an already-rendered admin dashboard shell (which is
// how the sidebar link works). A fresh full page load of that URL (e.g. a notification
// opened directly) hits the app's native not-found page instead. Worse, a hard reload of
// even a *real* admin route like "/admin" itself bounces back to the homepage (the app's
// own auth check appears to redirect before it finishes hydrating the session) — so
// window.location.href='/admin' isn't a safe fallback either. The one thing that reliably
// works is a plain client-side transition, exactly like a real user clicking the header's
// "Admin" nav link. So: if we're already inside the admin shell, jump straight to Reports;
// otherwise simulate a click on the real Admin link and open Reports once that shell mounts.
function navigateToAdminReports(){
if(isAdminPage() && document.querySelector('a[href="/admin/orders"]')){
if(window.location.pathname !== '/admin/reports'){ goToAdminReportsRoute('/admin/reports'); }
return;
}
var adminLink = document.querySelector('a[href="/admin"]');
if(adminLink){
try{ sessionStorage.setItem('ms-open-admin-reports', '1'); }catch(e){}
adminLink.click();
} else {
try{ sessionStorage.setItem('ms-open-admin-reports', '1'); }catch(e){}
window.location.href = '/admin';
}
}

function consumePendingAdminReportsOpen(){
var pending;
try{ pending = sessionStorage.getItem('ms-open-admin-reports'); }catch(e){ pending = null; }
if(!pending) return;
if(!document.querySelector('a[href="/admin/orders"]')) return;
try{ sessionStorage.removeItem('ms-open-admin-reports'); }catch(e){}
goToAdminReportsRoute('/admin/reports');
}

/* ---------- Teaser mode: full-screen overlay drawn on top of every route. Never touches
   the underlying page's DOM, links, or routing -- it only adds/removes a fixed-position
   layer above everything else, so it can never interfere with /admin's own rendering. ---------- */

var __msTeaserMode = null;
var __msTeaserLastFetch = 0;
var __msTeaserFetchInFlight = false;
function refreshTeaserMode(){
var now = Date.now();
if(__msTeaserFetchInFlight) return;
if(now - __msTeaserLastFetch < 15000) return;
__msTeaserFetchInFlight = true;
fetch(SUPABASE_URL + '/rest/v1/site_settings?select=teaser_mode&id=eq.1', {
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
}).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
__msTeaserMode = !!(rows && rows[0] && rows[0].teaser_mode);
__msTeaserLastFetch = Date.now();
__msTeaserFetchInFlight = false;
try{ patchTeaserVisitorGate(); }catch(e){ try{ console.error('[ms-teaser] gate threw', e); }catch(e2){} }
}).catch(function(){
__msTeaserLastFetch = Date.now();
__msTeaserFetchInFlight = false;
});
}

var __msTeaserAdminCheck = { token: null, isAdmin: null, lastFetch: 0, inFlight: false };
function refreshAdminStatusForTeaser(){
var token = getAdminAccessToken();
if(!token){
/* Guard against re-entrant recursion: patchTeaserVisitorGate() calls this
function, and this function (on state changes) calls patchTeaserVisitorGate()
back. Without this throttle check that pair calls each other forever,
synchronously, until the stack overflows. */
if(__msTeaserAdminCheck.token === null && (Date.now() - __msTeaserAdminCheck.lastFetch) < 15000) return;
__msTeaserAdminCheck = { token: null, isAdmin: false, lastFetch: Date.now(), inFlight: false };
try{ patchTeaserVisitorGate(); }catch(e){ try{ console.error('[ms-teaser] gate threw', e); }catch(e2){} }
return;
}
if(__msTeaserAdminCheck.token === token && (Date.now() - __msTeaserAdminCheck.lastFetch) < 15000) return;
if(__msTeaserAdminCheck.inFlight) return;
__msTeaserAdminCheck.inFlight = true;
var uid = decodeJwtSub(token);
fetch(SUPABASE_URL + '/rest/v1/profiles?select=is_admin&id=eq.' + uid, {
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token }
}).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
__msTeaserAdminCheck = { token: token, isAdmin: !!(rows && rows[0] && rows[0].is_admin), lastFetch: Date.now(), inFlight: false };
try{ patchTeaserVisitorGate(); }catch(e){ try{ console.error('[ms-teaser] gate threw', e); }catch(e2){} }
}).catch(function(){
__msTeaserAdminCheck.inFlight = false;
__msTeaserAdminCheck.lastFetch = Date.now();
});
}

/* Coin-catch mini-game: an "MS" box the visitor grabs and drags (mouse or
touch, via Pointer Events) around the overlay to catch coins that fall
continuously from the top -- gold coins are worth 5, silver 1, and fall
speed ramps up the longer a round runs. Any coin that reaches the ground
uncaught gets "eaten" by a little dragon patrolling the bottom edge, who
grows a size for each of 5 misses and then swallows the whole screen,
ending the round. Final scores that make the top 10 can be saved with a
3-letter initials entry to a shared Supabase leaderboard. Drag/click
listeners are bound once on document and always look up the CURRENT DOM
via querySelector, so this stays correct even if the overlay gets torn
down and rebuilt later. State lives on window so it survives rebuilds. */
function startTeaserCollectGame(el){
var BOX_SIZE = 112;
var COIN_COUNT = 10;
var COIN_MIN = 26, COIN_MAX = 40;
var MAX_MISSED = 5;
var DRAGON_WIDTH = 120;
var DRAGON_STAGES = [0.7, 0.9, 1.15, 1.4, 1.7, 1.7];

if(!window.__msGameState){
window.__msGameState = {
started: false,
score: 0, missed: 0, gameOver: false, startTime: Date.now(),
boxX: 0, boxY: 0, dragging: false, dragOffX: 0, dragOffY: 0, initedPos: false,
dragonX: window.innerWidth / 2 - DRAGON_WIDTH / 2, dragonLegPhase: 0,
coins: [], coinsLayerEl: null,
highScore: 0, leaderboard: [], leaderboardLoaded: false, leaderboardLastFetch: 0, leaderboardFetchInFlight: false
};
document.addEventListener('pointerdown', function(e){
var box = document.querySelector('.ms-game-box');
if(!box || !(e.target === box || (box.contains && box.contains(e.target)))) return;
var st = window.__msGameState;
/* The whole game is hidden until the visitor clicks the "MS" logo --
that first press just reveals it (coins/dragon/HUD start up); it does
NOT also begin a drag, so the box doesn't jump around on that click. */
if(!st.started){
if(window.__msBeginHiddenGame) window.__msBeginHiddenGame();
return;
}
st.dragging = true;
box.classList.add('ms-dragging');
st.dragOffX = e.clientX - st.boxX;
st.dragOffY = e.clientY - st.boxY;
if(box.setPointerCapture){ try{ box.setPointerCapture(e.pointerId); }catch(err){} }
});
document.addEventListener('pointermove', function(e){
var st = window.__msGameState;
if(!st.dragging) return;
var box = document.querySelector('.ms-game-box');
st.boxX = e.clientX - st.dragOffX;
st.boxY = e.clientY - st.dragOffY;
var maxX = Math.max(0, window.innerWidth - BOX_SIZE);
var maxY = Math.max(0, window.innerHeight - BOX_SIZE);
st.boxX = Math.min(Math.max(st.boxX, 0), maxX);
st.boxY = Math.min(Math.max(st.boxY, 0), maxY);
if(box) box.style.transform = 'translate3d(' + st.boxX + 'px,' + st.boxY + 'px,0)';
});
function endDrag(){
window.__msGameState.dragging = false;
var box = document.querySelector('.ms-game-box');
if(box) box.classList.remove('ms-dragging');
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
}

if(!window.__msGameButtonsBound){
window.__msGameButtonsBound = true;
document.addEventListener('click', function(e){
var t = e.target;
if(!t || !t.id) return;
if(t.id === 'ms-game-leaderboard-open') openLeaderboardModal();
else if(t.id === 'ms-game-leaderboard-close') closeLeaderboardModal();
else if(t.id === 'ms-game-skip-save') revertToTeaser();
else if(t.id === 'ms-game-save-score') submitScore();
});
document.addEventListener('input', function(e){
var t = e.target;
if(t && t.id && /^ms-game-initial-[0-2]$/.test(t.id)){
t.value = t.value.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 1);
if(t.value){
var idx = parseInt(t.id.slice(-1), 10);
var next = document.querySelector('#ms-game-initial-' + (idx + 1));
if(next) next.focus();
}
}
});
}

var state = window.__msGameState;
var box = el.querySelector('.ms-game-box');
var coinsLayer = el.querySelector('.ms-game-coins-layer');
var scoreEl = el.querySelector('#ms-game-score-num');
var missedEl = el.querySelector('#ms-game-missed-num');
if(!box || !coinsLayer) return;

/* Rests the "MS" box just above the coin-slab mockup (rather than at a
fixed viewport fraction that can overlap it on some screen sizes). */
function computeBoxRestY(){
var slab = document.querySelector('.ms-teaser-slab');
if(slab){
var r = slab.getBoundingClientRect();
if(r.height){ return Math.max(10, r.top - BOX_SIZE - 18); }
}
return window.innerHeight * 0.22;
}

if(!state.initedPos){
state.boxX = window.innerWidth / 2 - BOX_SIZE / 2;
state.boxY = computeBoxRestY();
state.initedPos = true;
}
box.style.transform = 'translate3d(' + state.boxX + 'px,' + state.boxY + 'px,0)';
if(scoreEl) scoreEl.textContent = state.score;
if(missedEl) missedEl.textContent = state.missed;

function coinSvg(isGold){
var color = isGold ? '#C5A44E' : '#B8B8C8';
var hl = isGold ? '#E8D48B' : '#D8D8E8';
var sh = isGold ? '#8B7332' : '#888898';
return '<svg width="100%" height="100%" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="8.5" fill="' + color + '" stroke="' + sh + '" stroke-width="0.5"/><circle cx="9" cy="9" r="7" fill="none" stroke="' + sh + '" stroke-width="0.3" opacity="0.5"/><circle cx="7" cy="7" r="1.4" fill="' + hl + '" opacity="0.5"/></svg>';
}

function speedMultiplier(){
var elapsed = (Date.now() - state.startTime) / 1000;
return Math.min(1 + elapsed / 25, 3.2);
}

function resetCoin(c){
c.size = COIN_MIN + Math.random() * (COIN_MAX - COIN_MIN);
c.el.style.width = c.size + 'px';
c.el.style.height = c.size + 'px';
c.x = Math.random() * Math.max(1, window.innerWidth - c.size);
c.y = -c.size - Math.random() * 60;
c.isGold = Math.random() > 0.65;
c.value = c.isGold ? 5 : 1;
c.el.innerHTML = coinSvg(c.isGold);
c.vy = (1 + Math.random() * 1.8) * speedMultiplier();
c.rot = Math.random() * 360;
c.vr = (Math.random() - 0.5) * 4;
}

function makeCoin(){
var elC = document.createElement('div');
elC.className = 'ms-game-coin';
coinsLayer.appendChild(elC);
var c = { el: elC, size: COIN_MIN, x: 0, y: 0, vy: 1, rot: 0, vr: 0, isGold: false, value: 1 };
resetCoin(c);
c.y = -c.size - Math.random() * window.innerHeight;
return c;
}

function spawnCatchPop(x, y, size, isGold){
var pop = document.createElement('div');
pop.className = 'ms-game-coin ms-caught';
pop.style.width = size + 'px';
pop.style.height = size + 'px';
pop.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
pop.innerHTML = coinSvg(isGold);
coinsLayer.appendChild(pop);
setTimeout(function(){ pop.remove(); }, 400);
}

function dragonScale(missed){
return DRAGON_STAGES[Math.min(missed, DRAGON_STAGES.length - 1)];
}

function registerMiss(){
var st = window.__msGameState;
if(st.gameOver) return;
st.missed += 1;
var me = document.querySelector('#ms-game-missed-num');
if(me) me.textContent = st.missed;
var dragon = document.querySelector('.ms-game-dragon');
if(dragon){
dragon.classList.add('ms-dragon-chomp');
setTimeout(function(){ dragon.classList.remove('ms-dragon-chomp'); }, 350);
/* Each catch makes the dragon look meaner: neutral for the first miss,
snarling from miss 2, fully furious (glowing eyes, bared fangs) from
miss 3 onward -- right up through the fire-breathing finale. */
dragon.classList.remove('ms-mean-1', 'ms-mean-2');
if(st.missed >= 3) dragon.classList.add('ms-mean-2');
else if(st.missed >= 1) dragon.classList.add('ms-mean-1');
}
if(st.missed >= MAX_MISSED){
endGame();
}
}

function endGame(){
var st = window.__msGameState;
st.gameOver = true;
var dragon = document.querySelector('.ms-game-dragon');
var blackout = document.querySelector('.ms-game-blackout');
var fire = document.querySelector('.ms-game-fire-breath');
/* No more growing huge and swallowing the scene -- instead the dragon
freezes in place, tilts its head back, and breathes fire that sweeps
out and engulfs the whole screen. */
if(dragon){
dragon.classList.add('ms-mean-2');
dragon.style.setProperty('--dragon-final-x', st.dragonX + 'px');
dragon.style.setProperty('--dragon-final-scale', dragonScale(st.missed));
dragon.classList.add('ms-fire-pose');
}
if(fire){
fire.style.setProperty('--fire-length', (window.innerWidth * 2.6) + 'px');
fire.style.left = (st.dragonX + DRAGON_WIDTH / 2) + 'px';
fire.style.top = (window.innerHeight - 100) + 'px';
}
/* Sequence: head tilts up immediately, fire breathes out a beat later,
the screen catches as the fire spreads, then the game-over card. */
setTimeout(function(){ if(fire) fire.classList.add('ms-breathing'); }, 300);
setTimeout(function(){ if(blackout) blackout.classList.add('ms-show'); }, 550);
setTimeout(function(){ showGameOverFlash(); }, 1500);
}

function escHtml(s){
return String(s).replace(/[&<>"']/g, function(ch){
return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
});
}

function renderLeaderboard(){
var st = window.__msGameState;
var list = document.querySelector('#ms-game-leaderboard-list');
if(!list) return;
if(!st.leaderboard || !st.leaderboard.length){
list.innerHTML = '<li><span>--</span><span>No scores yet</span></li>';
return;
}
var html = '';
for(var i = 0; i < st.leaderboard.length; i++){
var row = st.leaderboard[i];
html += '<li><span>' + (i + 1) + '. ' + escHtml(row.initials) + '</span><span>' + row.score + '</span></li>';
}
list.innerHTML = html;
}

function initTeaserLeaderboard(){
var st = window.__msGameState;
if(st.leaderboardFetchInFlight) return;
if(st.leaderboardLoaded && (Date.now() - st.leaderboardLastFetch) < 15000) return;
st.leaderboardFetchInFlight = true;
fetch(SUPABASE_URL + '/rest/v1/teaser_game_scores?select=initials,score&order=score.desc&limit=10', {
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
}).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
st.leaderboard = rows || [];
st.leaderboardLoaded = true;
st.leaderboardLastFetch = Date.now();
st.leaderboardFetchInFlight = false;
st.highScore = (rows && rows[0] && rows[0].score) || 0;
var hs = document.querySelector('#ms-game-highscore-num');
if(hs) hs.textContent = st.highScore;
renderLeaderboard();
}).catch(function(e){
st.leaderboardFetchInFlight = false;
try{ console.error('[ms-teaser] leaderboard fetch failed', e); }catch(err){}
});
}

function openLeaderboardModal(){
initTeaserLeaderboard();
renderLeaderboard();
var modal = document.querySelector('#ms-game-leaderboard-modal');
if(modal) modal.style.display = 'flex';
}

function closeLeaderboardModal(){
var modal = document.querySelector('#ms-game-leaderboard-modal');
if(modal) modal.style.display = 'none';
}

/* Retro arcade-style ending: flash "GAME OVER" (or "NICE JOB" for a
top-10 score) in 8-bit font, then either collect initials for the
leaderboard or just revert straight back to the hidden teaser. */
function showGameOverFlash(){
var st = window.__msGameState;
var qualifies = st.score > 0 && (!st.leaderboard || st.leaderboard.length < 10 || st.score > st.leaderboard[st.leaderboard.length - 1].score);
var flash = document.querySelector('.ms-game-flash');
var flashText = document.querySelector('#ms-game-flash-text');
if(flashText) flashText.textContent = qualifies ? 'NICE JOB' : 'GAME OVER';
if(flash) flash.classList.add('ms-show');
setTimeout(function(){
if(flash) flash.classList.remove('ms-show');
if(qualifies){ showInitialsEntry(); } else { revertToTeaser(); }
}, 1700);
}

function showInitialsEntry(){
var st = window.__msGameState;
var modal = document.querySelector('#ms-game-over-modal');
var finalScoreEl = document.querySelector('#ms-game-final-score');
if(finalScoreEl) finalScoreEl.textContent = 'Score: ' + st.score;
if(modal) modal.style.display = 'flex';
var i0 = document.querySelector('#ms-game-initial-0');
var i1 = document.querySelector('#ms-game-initial-1');
var i2 = document.querySelector('#ms-game-initial-2');
if(i0){ i0.value = ''; setTimeout(function(){ i0.focus(); }, 50); }
if(i1) i1.value = '';
if(i2) i2.value = '';
}

function submitScore(){
var st = window.__msGameState;
var i0 = document.querySelector('#ms-game-initial-0');
var i1 = document.querySelector('#ms-game-initial-1');
var i2 = document.querySelector('#ms-game-initial-2');
var initials = ((i0 && i0.value) || '') + ((i1 && i1.value) || '') + ((i2 && i2.value) || '');
initials = initials.toUpperCase().replace(/[^A-Z]/g, '');
while(initials.length < 3){ initials += 'A'; }
var saveBtn = document.querySelector('#ms-game-save-score');
if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Saving...'; }
fetch(SUPABASE_URL + '/rest/v1/teaser_game_scores', {
method: 'POST',
headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
body: JSON.stringify({ initials: initials, score: st.score })
}).then(function(){
st.leaderboardLoaded = false;
initTeaserLeaderboard();
}).catch(function(e){
try{ console.error('[ms-teaser] score submit failed', e); }catch(err){}
}).then(function(){
if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Save Score'; }
revertToTeaser();
});
}

/* Fully un-reveals the hidden game: dragon, HUD, and fire/blackout effects
all disappear again, coins are cleared out, and the "MS" box drops back
into its plain static logo spot -- clicking it starts a fresh round. The
box/logo itself is never hidden or removed, only the game trappings
around it. */
function revertToTeaser(){
var st = window.__msGameState;
st.started = false;
st.gameOver = false;
st.score = 0;
st.missed = 0;
var se = document.querySelector('#ms-game-score-num'); if(se) se.textContent = 0;
var me = document.querySelector('#ms-game-missed-num'); if(me) me.textContent = 0;
el.classList.remove('ms-teaser-game-started');
var dragon = document.querySelector('.ms-game-dragon');
if(dragon){
dragon.classList.remove('ms-fire-pose', 'ms-mean-1', 'ms-mean-2');
dragon.style.removeProperty('--dragon-final-x');
dragon.style.removeProperty('--dragon-final-scale');
dragon.style.transform = '';
}
var fire = document.querySelector('.ms-game-fire-breath');
if(fire) fire.classList.remove('ms-breathing');
var blackout = document.querySelector('.ms-game-blackout');
if(blackout) blackout.classList.remove('ms-show');
var flash = document.querySelector('.ms-game-flash');
if(flash) flash.classList.remove('ms-show');
var modal = document.querySelector('#ms-game-over-modal');
if(modal) modal.style.display = 'none';
if(coinsLayer) coinsLayer.innerHTML = '';
st.coins = [];
st.coinsLayerEl = null;
var box = document.querySelector('.ms-game-box');
if(box){
st.boxX = window.innerWidth / 2 - BOX_SIZE / 2;
st.boxY = computeBoxRestY();
box.style.transform = 'translate3d(' + st.boxX + 'px,' + st.boxY + 'px,0)';
}
}

/* The whole mini-game stays hidden (no coins, no dragon, no HUD) until the
visitor clicks the "MS" logo -- see the pointerdown handler above, which
calls window.__msBeginHiddenGame(). If the game was already started in a
previous build (a rare overlay rebuild mid-play), restore that revealed
state immediately instead of re-hiding it behind another click. */
if(state.started){
el.classList.add('ms-teaser-game-started');
if(state.coinsLayerEl !== coinsLayer){
state.coinsLayerEl = coinsLayer;
state.coins = [];
for(var i = 0; i < COIN_COUNT; i++){ state.coins.push(makeCoin()); }
}
initTeaserLeaderboard();
}

function beginHiddenGame(){
var st = window.__msGameState;
if(st.started) return;
st.started = true;
el.classList.add('ms-teaser-game-started');
st.coinsLayerEl = coinsLayer;
st.coins = [];
for(var i = 0; i < COIN_COUNT; i++){ st.coins.push(makeCoin()); }
st.startTime = Date.now();
st.dragonX = window.innerWidth / 2 - DRAGON_WIDTH / 2;
st.dragonLegPhase = 0;
initTeaserLeaderboard();
}
window.__msBeginHiddenGame = beginHiddenGame;

if(window.__msGameLoopInit) return;
window.__msGameLoopInit = true;
function frame(){
var st = window.__msGameState;
var curBox = document.querySelector('.ms-game-box');
var dragon = document.querySelector('.ms-game-dragon');
if(dragon && !st.gameOver){
/* The dragon actively chases whichever falling coin is closest to
hitting the ground, so it looks like it's racing to gobble up
whatever's about to be missed, rather than just idly wandering. */
var target = null;
for(var gi = 0; gi < st.coins.length; gi++){
var gc = st.coins[gi];
if(!target || gc.y > target.y) target = gc;
}
var targetX = target ? (target.x + target.size / 2 - DRAGON_WIDTH / 2) : st.dragonX;
var maxDragonX = Math.max(0, window.innerWidth - DRAGON_WIDTH);
targetX = Math.min(Math.max(targetX, 0), maxDragonX);
var prevX = st.dragonX;
st.dragonX += (targetX - st.dragonX) * 0.15;
var moveSpeed = Math.abs(st.dragonX - prevX);
st.dragonLegPhase += 0.16 + Math.min(1.1, moveSpeed * 0.09);
var bob = Math.abs(Math.sin(st.dragonLegPhase)) * -3;
dragon.style.transform = 'translate3d(' + st.dragonX.toFixed(1) + 'px,' + bob.toFixed(1) + 'px,0) scale(' + dragonScale(st.missed) + ')';
var legL = dragon.querySelector('.ms-dragon-leg-left');
var legR = dragon.querySelector('.ms-dragon-leg-right');
if(legL){
var lLift = Math.sin(st.dragonLegPhase) * 7;
legL.style.transform = 'translateY(' + Math.min(0, lLift).toFixed(1) + 'px) rotate(' + (lLift * 1.4).toFixed(1) + 'deg)';
}
if(legR){
var rLift = Math.sin(st.dragonLegPhase + Math.PI) * 7;
legR.style.transform = 'translateY(' + Math.min(0, rLift).toFixed(1) + 'px) rotate(' + (rLift * 1.4).toFixed(1) + 'deg)';
}
}
if(curBox && st.coins.length && !st.gameOver){
/* Shrink the hitbox a bit so it feels fair -- catch with the "well" of
the box, not its outer glow/border. */
var pad = 14;
var hbx1 = st.boxX + pad, hby1 = st.boxY + pad, hbx2 = st.boxX + BOX_SIZE - pad, hby2 = st.boxY + BOX_SIZE - pad;
var scoreChanged = false;
var groundY = window.innerHeight - 20;
for(var i = 0; i < st.coins.length; i++){
var c = st.coins[i];
c.y += c.vy;
c.rot += c.vr;
var overlap = c.x < hbx2 && (c.x + c.size) > hbx1 && c.y < hby2 && (c.y + c.size) > hby1;
if(overlap){
st.score += c.value;
scoreChanged = true;
spawnCatchPop(c.x, c.y, c.size, c.isGold);
resetCoin(c);
} else if((c.y + c.size) >= groundY){
registerMiss();
resetCoin(c);
if(window.__msGameState.gameOver) break;
}
c.el.style.transform = 'translate3d(' + c.x.toFixed(1) + 'px,' + c.y.toFixed(1) + 'px,0) rotate(' + c.rot.toFixed(1) + 'deg)';
}
if(scoreChanged){
var se = document.querySelector('#ms-game-score-num');
if(se) se.textContent = st.score;
}
}
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}

function patchTeaserVisitorGate(){

refreshTeaserMode();

if(__msTeaserAdminCheck.isAdmin === null){ return; }
var el = ensureTeaserOverlay();
buildTeaserCinematicContent(el);
}

onReady(function(){
runAll(document);
document.addEventListener('input', function(e){
var v = (e.target && e.target.value || '').trim();
if(/^MS-[0-9A-F]+$/i.test(v)) lastLookupCode = v.toUpperCase();
}, true);
var mo = new MutationObserver(function(muts){
var needsFullScan = false;
for(var i = 0; i < muts.length; i++){
var m = muts[i];
if(m.type === 'attributes' && m.attributeName === 'style'){
fixTransform(m.target);
}
if(m.addedNodes && m.addedNodes.length) needsFullScan = true;
}
if(needsFullScan) runAll(document);
});
mo.observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['style'] });

var tries = 0;
var iv = setInterval(function(){
tries++;
patchToolHeader();
patchToolOpenLightbox();
runAll(document);
if(tries > 20) clearInterval(iv);
}, 500);

setInterval(function(){ refreshPaymentsBadge(); }, 20000);
});
})();
